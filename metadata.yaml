versions:
  - sha: 119b4561580954e49718b747c706a228af84e333
    changeNotes: |
      Initial release — Google Consent Mode v2 integration.
      - Supports all GCM v2 consent types (ad_storage, analytics_storage, ad_user_data, ad_personalization, functionality_storage, personalization_storage, security_storage)
      - Automatic consent reading from Veribenim localStorage
      - Region-based default consent
      - URL passthrough and ads data redaction
      - Real-time consent change listener via __vbn_gtm_onConsentChange callback
      - Optional dataLayer event push
